[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrweq"
version = "0.4.0"
description = "Python implementation of the Revised Wind Erosion Equation (RWEQ)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "lxyNgeo" }]
keywords = ["wind erosion", "RWEQ", "soil erosion", "GIS", "remote sensing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.24",
    "rasterio>=1.3",
]

[project.urls]
Homepage = "https://github.com/lxyNgeo/pyrweq"
Repository = "https://github.com/lxyNgeo/pyrweq"
Issues = "https://github.com/lxyNgeo/pyrweq/issues"

[project.optional-dependencies]
dask = ["dask[array]>=2023.1"]
geo = ["geopandas>=0.14"]
plot = ["matplotlib>=3.7"]
dev = ["dask[array]>=2023.1", "nbformat>=5.9", "psutil>=5.9"]

[project.scripts]
pyrweq = "pyrweq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
